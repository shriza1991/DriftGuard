services:
  mock-api:
    build: .
    command: ["python", "-m", "uvicorn", "mock_api.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  orchestrator:
    build: .
    environment:
      ORCHESTRATOR_MOCK_API_URL: http://mock-api:8001
    command: ["python", "-m", "uvicorn", "orchestrator.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mock-api:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      orchestrator:
        condition: service_healthy
    ports: ["5173:80"]
