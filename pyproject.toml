[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftguard"
version = "0.1.0"
description = "Self-Healing AI Agent Registry Prototype - Genesis Hackathon PS01"
authors = [
    { name = "DriftGuard Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "jsonschema>=4.21.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.0"]
openai = ["langchain-openai>=0.2"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["orchestrator*", "mock_api*", "evaluation*"]
